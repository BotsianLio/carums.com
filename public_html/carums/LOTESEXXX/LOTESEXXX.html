<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#LOTESE</title>
  <link rel="stylesheet" href="../carums_css/carums_base.css">
</head>
<body>

  <div class="navbar" id="navbar">
    <a href="../../index.html" id="homepage">CARUM BETA</a>
    <a href="../../user.html" class="navbar_font">Login</a>
    <a href="../../news.html" class="navbar_font">&nbsp;&nbsp;&nbsp;News</a>
    <div class="container_crs">
      <form action="" class="searchbar">
        <input type="text" placeholder="Carums Topic Search" name="search_crs" autocorrect="off"> 
        <button type="submit"><img src="../../icons/search.png"></button>
      </form>
    </div>
  </div>

  <div class="container">
    <div class="sidebar">
      <div class="divide_line"></div>
      <div class="line"></div>
      <span class="carum_logo"><img src="LOTESEXXXP/lot_logo.svg.png" alt="lotus Logo"></span>
      <h2 class="CarumTag">#LOTESE</h2>
      <p class="CarumTag_for">CARUMTAG FOR</p>
      <p class="car_model_name">Lotus Elise (all models)</p>
      <div class="line"></div>
      <!-- sorting buttons -->
       <p class="sort_by">THREADS SORTED BY</p>
      <div class="sort_group">
        <button>Default</button>
        <button>Hottest</button>
        <button>Newest</button>
      </div>
      <div class="line"></div>
      <p class="topics">TOPICS</p>
      <!-- Vertical choice bars -->
      <div class="category_list">
        <div class="category_item">
          <button class="text_button">
            <span><img src=""></span>General</button>
        </div>
        <div class="category_item">
          <button class="text_button">
            <span><img src=""></span>Mechanical</button>
        </div>
        <div class="category_item">
          <button class="text_button">
            <span><img src=""></span>Show-off</button>
        </div>
        <div class="category_item">
          <button class="text_button">
            <span><img src=""></span>Events</button>
        </div>
        <div class="category_item">
          <button class="text_button">
            <span><img src=""></span>Ask an Owner</button>
        </div>
        <!-- Add more category items as needed -->
        <div class="divide_line"></div>
      </div>
      
      <!-- Sidebar footer -->
      <footer>
        <div class="footer_c">
          <ul>
            <li><a href="#">&copy; 2024 CARUM  ALL RIGHT RESERVED</a></li>
          </ul>
        </div>
        <div class="footer_b">
          <p>CARUM</p>
        </div>
      </footer>
    </div>
  
    <div class="main_content">
      <!-- Top image -->
      <img src="LOTESEXXXP/ese_top.jpg" alt="Top Image" class="top_image">
      
      <!-- Content area for threads or discussions -->
      <div class="threads">
        <!-- Your forum threads or discussions will be here -->
      </div>
    </div>
  </div>
  

  
  
  <script src="../carums_js/carums.js"></script>
